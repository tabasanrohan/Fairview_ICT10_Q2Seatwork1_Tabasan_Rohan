
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>ICT Club Checker</title>

    <style>

        body {
            background-image: url('https://i.pinimg.com/736x/f6/89/77/f689774c7eaed97ad904c7a9232a5f7c.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-color: #344b2c;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif

            margin: 0;
            padding: 30px;
        }


        h1 {
            text-align: center;

            color: #344b2c;

            font-size: 35px;

            margin-top: 25px;
            margin-bottom: 10px;
        }


        h2 {
            text-align: center;

            color: #344b2c;

            font-size: 35px;

            margin-top: 25px;
            margin-bottom: 10px;
        }

        h3 {
            text-align: center;

            color: #617653;

            font-size: 18px;

            margin-bottom: 30px;
        }


        .container {
            background-image: url('https://i.pinimg.com/736x/f6/89/77/f689774c7eaed97ad904c7a9232a5f7c.jpg');
            background-repeat: no-repeat;
            background-size: cover;

            width: 100%;
            box-sizing: border-box;
            margin: auto;

            padding: 35px;
            border: 2px solid #8ba17b;

            border-radius: 15px;
            box-shadow: 0px 5px 12px #344b2c25;
        }


        .form {
            background-image: url('https://i.pinimg.com/736x/f6/89/77/f689774c7eaed97ad904c7a9232a5f7c.jpg');
            background-repeat: no-repeat;
            background-size: cover;

            padding: 20px;
            border-radius: 10px;
        }


        .input-group {
            margin: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;

            color: #344b2c;
            font-size: 18px;
            font-weight: bold;
        }


        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #9aaa8e;

            background-color: white;

            color: #344b2c;

            font-size: 16px;
            font-family: 'Trebuchet MS', Arial, sans-serif;
        }


        input:focus {
            outline: none;
            border: 2px solid #617f50;
        }


        button {
            display: block;

            margin: 25px auto 10px;
            padding: 13px 35px;
            border-radius: 8px;
            border: none;

            background-color: #526d43;
            color: white;

            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }


        button:hover {
            background-color: #3e5633;
        }


        .result {
            margin-top: 25px;

            padding: 20px;
            background-color: #e4ebdd;
            border-left: 5px solid #617f50;
            border-radius: 8px;

            min-height: 100px;
        }


        .result h2 {
            text-align: center;

            color: #344b2c;
            margin-top: 5px;
        }


        #message {
            text-align: center;
            color: #344b2c;

            font-size: 18px;
            line-height: 1.5;
        }
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }
            h1 {
                font-size: 28px;
            }

            .container {
                padding: 18px;
            }

            .form {
                padding: 10px;
            }

        }

    </style>

</head>


<body>


    <h1>⋆˙⟡ BOOK CLUB CHECKER ⊹ ࣪ ˖</h1>
    <h2> · · ─ ·ʚɞ· ─ · ·</h2>
    <h3>Candidate Verification System</h3>


    <div class="container">


        <div class="form">


            <div class="input-group">

                <label>First Name:</label>

                <input
                    type="text"
                    id="firstname"
                    placeholder="⁀➴ Enter your first name"
                >

            </div>


            <div class="input-group">

                <label>Last Name:</label>

                <input
                    type="text"
                    id="lastname"
                    placeholder="⁀➴ Enter your last name"
                >

            </div>


        </div>


        <button py-click="check_candidate">
            Check Membership
        </button>


        <div class="result">

            <h2>❀°Verification Result°❀</h2>

            <p id="message">
                𓏲﹕Enter your name above to check your membership﹕⸝⸝
     
            </p>

        </div>


    </div>



    <script type="py" src="main.py"></script>


</body>

</html>
